<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="600" height="300" role="img" aria-label="Ashlar: Financial workflow engine for AI agents">
<title>Ashlar: Financial workflow engine for AI agents</title>
<defs><filter id="blur" x="-60%" y="-120%" width="220%" height="340%"><feGaussianBlur stdDeviation="70"/></filter><filter id="blurS" x="-60%" y="-120%" width="220%" height="340%"><feGaussianBlur stdDeviation="28"/></filter><filter id="glow" x="-20%" y="-60%" width="140%" height="220%"><feGaussianBlur stdDeviation="12"/></filter><filter id="grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><clipPath id="clip"><rect width="600" height="300" rx="22"/></clipPath><linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".06"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient><linearGradient id="bar" x1="0" x2="1"><stop offset="0" stop-color="#22D3EE"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0"/></linearGradient></defs>
<style>@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>

<g clip-path="url(#clip)">
  <rect width="600" height="300" fill="#0B0B12"/>
  <ellipse cx="520" cy="10" rx="190" ry="100" fill="#22D3EE" opacity=".28" filter="url(#blur)"/>
  <ellipse cx="40" cy="320" rx="150" ry="70" fill="#7C3AED" opacity=".14" filter="url(#blur)"/>
  <rect width="600" height="300" fill="url(#sheen)"/>
  <rect x="0" y="0" width="600" height="3" fill="url(#bar)"/>
  <rect width="600" height="300" filter="url(#grain)" opacity=".05"/>
</g>
<rect x=".5" y=".5" width="599" height="299" rx="21.5" fill="none" stroke="#fff" stroke-opacity=".10"/>
<text x="32" y="50" font-family="'JetBrains Mono', 'SF Mono', 'Fira Code', Consolas, 'Courier New', monospace" font-size="12.5" letter-spacing="3" fill="#22D3EE">02 · AI AGENTS</text>
<g transform="translate(540,34)" fill="none" stroke="#22D3EE" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M0 14 L14 0 M3 0 H14 V11"/></g>
<text x="32" y="100" font-family="Inter, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="38" font-weight="800" fill="#E4E4E7">Ashlar</text>
<text x="32" y="130" font-family="Inter, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16.5" font-weight="600" fill="#22D3EE">Financial workflow engine for AI agents</text>
<text x="32" y="166" font-family="Inter, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#A1A1AA">Type one plain-English instruction, like “pay every</text><text x="32" y="190" font-family="Inter, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#A1A1AA">approved invoice every Friday”, and it becomes a</text><text x="32" y="214" font-family="Inter, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#A1A1AA">fixed, on-chain workflow on Solana.</text>
<rect x="32.0" y="244" width="102.0" height="26" rx="13" fill="#22D3EE" fill-opacity=".10" stroke="#22D3EE" stroke-opacity=".45"/><text x="83.0" y="261.5" text-anchor="middle" font-family="'JetBrains Mono', 'SF Mono', 'Fira Code', Consolas, 'Courier New', monospace" font-size="12.5" fill="#E4E4E7">TypeScript</text><rect x="144.0" y="244" width="71.6" height="26" rx="13" fill="#22D3EE" fill-opacity=".10" stroke="#22D3EE" stroke-opacity=".45"/><text x="179.8" y="261.5" text-anchor="middle" font-family="'JetBrains Mono', 'SF Mono', 'Fira Code', Consolas, 'Courier New', monospace" font-size="12.5" fill="#E4E4E7">Solana</text><rect x="225.6" y="244" width="94.4" height="26" rx="13" fill="#22D3EE" fill-opacity=".10" stroke="#22D3EE" stroke-opacity=".45"/><text x="272.8" y="261.5" text-anchor="middle" font-family="'JetBrains Mono', 'SF Mono', 'Fira Code', Consolas, 'Courier New', monospace" font-size="12.5" fill="#E4E4E7">AI Agents</text>
